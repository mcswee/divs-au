<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Capitals Quiz</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --accent: #3b82f6;
      --correct: #22c55e;
      --incorrect: #ef4444;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .quiz-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 450px;
      text-align: center;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #a0a0a0;
      margin-bottom: 1.5rem;
    }

    .country-display {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #333;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit { background: var(--accent); color: white; }
    .btn-skip { background: #333; color: #aaa; }
    button:hover { opacity: 0.9; }

    .feedback {
      margin-top: 1.2rem;
      font-weight: 600;
      min-height: 1.5em;
    }
    .feedback.correct { color: var(--correct); }
    .feedback.incorrect { color: var(--incorrect); }
  </style>
</head>

    <div class="button-group">

  </form>

  <div class="feedback" id="feedback"></div>

  let currentPair = {};
  let score = 0;
  let streak = 0;
  let isWaitingForNext = false;

  const countryEl = document.getElementById("country-name");
  const inputEl = document.getElementById("user-input");
  const feedbackEl = document.getElementById("feedback");
  const scoreEl = document.getElementById("score");
  const streakEl = document.getElementById("streak");
  const formEl = document.getElementById("quiz-form");
  const skipBtn = document.getElementById("skip-btn");

  function nextQuestion() {
    isWaitingForNext = false;
    inputEl.value = "";
    inputEl.disabled = false;
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    
    const randomIndex = Math.floor(Math.random() * capitalsData.length);
    currentPair = capitalsData[randomIndex];
    
    // Display flag emoji alongside the country name
    countryEl.textContent = `${currentPair.emoji} ${currentPair.country}`;
    inputEl.focus();
  }

  function sanitize(str) {
    return str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  formEl.addEventListener("submit", (e) => {
    e.preventDefault();
    if (isWaitingForNext) {
      nextQuestion();
      return;
    }

    const userGuess = sanitize(inputEl.value);
    const correctAnswer = sanitize(currentPair.capital);

    if (userGuess === "") return;

    isWaitingForNext = true;
    inputEl.disabled = true;

    if (userGuess === correctAnswer) {
      score++;
      streak++;
      feedbackEl.textContent = "Correct!";
      feedbackEl.classList.add("correct");
    } else {
      streak = 0;
      feedbackEl.textContent = `Incorrect. Capital is ${currentPair.capital}.`;
      feedbackEl.classList.add("incorrect");
    }

    scoreEl.textContent = score;
    streakEl.textContent = streak;

    setTimeout(nextQuestion, 1600);
  });

  skipBtn.addEventListener("click", () => {
    if (isWaitingForNext) return;
    streak = 0;
    streakEl.textContent = streak;
    feedbackEl.textContent = `Skipped. Capital is ${currentPair.capital}.`;
    feedbackEl.classList.add("incorrect");
    isWaitingForNext = true;
    inputEl.disabled = true;
    setTimeout(nextQuestion, 1600);
  });

  nextQuestion();
