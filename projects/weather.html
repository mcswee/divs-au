    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
    }

    /* Style for the floating city badges */
    .weather-badge {
      background: rgba(10, 20, 30, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .weather-badge strong {
      color: #fff;
      font-weight: 600;
    }

    /* The colored box specifically for the temperature */
    .temp-box {
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
  </style>

      { temp: -10, color: [100, 109, 190] }, // Blue
      { temp: 0,   color: [142, 189, 208] }, // Cyan
      { temp: 10,  color: [100, 190, 109] }, // Green
      { temp: 20,  color: [230, 206, 120] }, // Yellow
      { temp: 30,  color: [220, 166, 130] }, // Orange
      { temp: 40,  color: [220, 130, 130] }, // Red
      { temp: 50,  color: [206, 184, 184] }  // Pinky Red
    ];

    function interpolate(start, end, t) {
      return start + (end - start) * t;
    }

    function getTemperatureColor(temp) {
      if (typeof temp !== 'number' || isNaN(temp)) return 'rgba(100, 100, 100, 0.9)'; // Neutral grey for fallback

      if (temp <= colorScale[0].temp) return `rgb(${colorScale[0].color.join(',')})`;
      if (temp >= colorScale[colorScale.length - 1].temp) return `rgb(${colorScale[colorScale.length - 1].color.join(',')})`;

      let lower, upper;
      for (let i = 0; i < colorScale.length - 1; i++) {
        if (temp >= colorScale[i].temp && temp <= colorScale[i + 1].temp) {
          lower = colorScale[i];
          upper = colorScale[i + 1];
          break;
        }
      }

      const range = upper.temp - lower.temp;
      const adjustedTemp = temp - lower.temp;
      const t = adjustedTemp / range;

      const r = Math.round(interpolate(lower.color[0], upper.color[0], t));
      const g = Math.round(interpolate(lower.color[1], upper.color[1], t));
      const b = Math.round(interpolate(lower.color[2], upper.color[2], t));

      return `rgba(${r}, ${g}, ${b}, 0.9)`;
    }

    // --- COLLISION DETECTION ---
    // Runs once per stop, after badges have settled at their projected
    // screen positions. Camera is stationary during the pause, so a single
    // measure-and-resolve pass is enough — no need to re-run per frame.
    function resolveBadgeCollisions(attempt = 0) {
      const badges = Array.from(document.querySelectorAll('.weather-badge'));
      if (badges.length < 2) return;

      const GAP = 10; // breathing room between stacked badges, in px

      const items = badges.map(el => {
        const rect = el.getBoundingClientRect();
        return {
          el,
          top: rect.top,
          bottom: rect.bottom,
          left: rect.left,
          right: rect.right,
          width: rect.width,
          height: rect.height
        };
      });

      // If globe.gl hasn't finished placing the badges yet, rects come
      // back as zero-size at the origin. Retry a few times on later
      // frames instead of silently doing nothing.
      const notLaidOutYet = items.some(i => i.width === 0 && i.height === 0);
      if (notLaidOutYet && attempt < 10) {
        requestAnimationFrame(() => resolveBadgeCollisions(attempt + 1));
        return;
      }

      console.debug(`[collision] resolving ${items.length} badges on attempt ${attempt}`);

      // Process top-to-bottom so higher badges settle first and lower
      // ones stack beneath anything they'd otherwise overlap.
      items.sort((a, b) => a.top - b.top);

      const placed = [];

      items.forEach(item => {
        let shiftDown = 0;

        for (const other of placed) {
          const horizontalOverlap = item.left < other.right && item.right > other.left;
          if (!horizontalOverlap) continue;

          const currentTop = item.top + shiftDown;
          const currentBottom = item.bottom + shiftDown;
          const verticalOverlap = currentTop < other.bottom + GAP && currentBottom > other.top - GAP;

          if (verticalOverlap) {
            shiftDown += (other.bottom + GAP) - currentTop;
          }
        }

        if (shiftDown > 0) {
          const newTransform = `translate(-50%, calc(-100% + ${shiftDown}px))`;
          item.el.style.transform = newTransform;
          const label = item.el.querySelector('strong')?.textContent;
          console.debug(`[collision] pushed ${label} down ${Math.round(shiftDown)}px, connected=${item.el.isConnected}`);

          // Sanity check: does something else overwrite this transform
          // before the next paint?
          requestAnimationFrame(() => {
            if (item.el.style.transform !== newTransform) {
              console.warn(`[collision] ${label} transform was overwritten next frame! set "${newTransform}" but now "${item.el.style.transform}"`);
            }
          });
        }

        placed.push({
          top: item.top + shiftDown,
          bottom: item.bottom + shiftDown,
          left: item.left,
          right: item.right
        });
      });
    }

    async function getWeatherForCities(cities) { 
      const CACHE_TTL = 60 * 60 * 1000; // 60 minutes
      const now = Date.now();

      const cachedRaw = sessionStorage.getItem('weather_cache');
      const cache = cachedRaw ? JSON.parse(cachedRaw) : {};

      const missingCities = [];
      const resultsMap = {};

      // Check cache first
      cities.forEach(city => {
        const key = `${city.lat}_${city.lng}`;
        if (cache[key] && (now - cache[key].timestamp < CACHE_TTL)) {
          resultsMap[key] = cache[key].temp;
        } else {
          missingCities.push(city);
        }
      });

      // If all cities are already cached, return immediately
      if (missingCities.length === 0) {
        return cities.map(city => ({
          ...city,
          temp: resultsMap[`${city.lat}_${city.lng}`]
        }));
      }

      // Fetch missing cities
      try { 
        const lats = missingCities.map(c => c.lat).join(','); 
        const lngs = missingCities.map(c => c.lng).join(','); 

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current_weather=true`; 
        const res = await fetch(url); 
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json(); 
        
        missingCities.forEach((city, idx) => {
          let rawTemp;
          if (Array.isArray(data)) {
            rawTemp = data[idx]?.current_weather?.temperature;
          } else if (Array.isArray(data.current_weather)) {
            rawTemp = data.current_weather[idx]?.temperature;
          } else {
            rawTemp = data.current_weather?.temperature;
          }

          const parsedTemp = (rawTemp !== undefined && rawTemp !== null) ? Math.round(rawTemp) : '--';
          const key = `${city.lat}_${city.lng}`;

          cache[key] = { temp: parsedTemp, timestamp: now };
          resultsMap[key] = parsedTemp;
        });

        sessionStorage.setItem('weather_cache', JSON.stringify(cache));

      } catch (err) { 
        console.error("Weather fetch failed (Rate limit or network error). Using fallback.", err); 
        
        // Fallback: populate un-cached cities with '--' so they still display on the globe
        missingCities.forEach(city => {
          resultsMap[`${city.lat}_${city.lng}`] = '--';
        });
      } 

      return cities.map(city => ({
        ...city,
        temp: resultsMap[`${city.lat}_${city.lng}`]
      }));
    } 

    let currentStopIndex = 0; 
    const FLY_DURATION = 3500; 
    const PAUSE_DURATION = 6000; 

    async function runWeatherTour() { 
      const stop = STOPS[currentStopIndex]; 

      // Remove previous markers while rotating 
      world.htmlElementsData([]); 

      // Move camera 
      world.pointOfView(stop.lookAt, FLY_DURATION); 

      // Fetch new data while rotating 
      const weatherData = await getWeatherForCities(stop.cities); 

      // Render weather badges once arrived 
      setTimeout(() => { 
        world.htmlElementsData(weatherData); 

        // Wait two frames so the browser has actually laid out the new
        // badges before we measure them for collisions.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => resolveBadgeCollisions());
        });
      }, FLY_DURATION); 

      // Loop to next region 
      setTimeout(() => { 
        currentStopIndex = (currentStopIndex + 1) % STOPS.length; 
        runWeatherTour(); 
      }, FLY_DURATION + PAUSE_DURATION); 
    } 

    // Start tour 
    runWeatherTour();
