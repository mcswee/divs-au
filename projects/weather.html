      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
    }

    /* Style for the floating city badges */
    .weather-badge {
      background: rgba(10, 20, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .weather-badge strong {
      color: #fff;
    }
  </style>
</head>

    // Initialize Globe
    const world = Globe()(document.getElementById('globe-container'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-day.jpg')
      .htmlElementsData([])
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = 'weather-badge';
        el.innerHTML = `${d.name} <strong>${d.temp}°</strong>`;
        return el;
      });

    async function getWeatherForCities(cities) {
      const lats = cities.map(c => c.lat).join(',');
      const lngs = cities.map(c => c.lng).join(',');

      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current_weather=true`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const results = Array.isArray(data) ? data : [data];

        return cities.map((city, idx) => ({
          ...city,
          temp: Math.round(results[idx].current_weather.temperature)
        }));
      } catch (err) {
        console.error("Failed to fetch weather data", err);
        return [];
      }
    }

    let currentStopIndex = 0;
    const FLY_DURATION = 3500;
    const PAUSE_DURATION = 6000;

    async function runWeatherTour() {
      const stop = STOPS[currentStopIndex];

      // Remove previous markers while rotating
      world.htmlElementsData([]);

      // Move camera
      world.pointOfView(stop.lookAt, FLY_DURATION);

      // Fetch new data while rotating
      const weatherData = await getWeatherForCities(stop.cities);

      // Render weather badges once arrived
      setTimeout(() => {
        world.htmlElementsData(weatherData);
      }, FLY_DURATION);

      // Loop to next region
      setTimeout(() => {
        currentStopIndex = (currentStopIndex + 1) % STOPS.length;
        runWeatherTour();
      }, FLY_DURATION + PAUSE_DURATION);
    }

    // Start tour
    runWeatherTour();
  </script>
