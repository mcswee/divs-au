    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #006;
      overflow: hidden;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
    }

    #pause-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(10, 20, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      transition: opacity 0.2s ease, background 0.2s ease;
      z-index: 10;
    }

    #pause-toggle:hover {
      opacity: 1;
      background: rgba(10, 20, 30, 0.9);
    }

    /* Style for the floating city badges */
    .weather-badge {
      background: rgba(250, 250, 250, 0.9);
      padding-left 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .weather-badge strong {
      color: #333;
      text-transform: uppercase;
      font-weight: 600;
      padding: 8px, 8px;
      margin-left: 6px;
      border-radius: 0px, 6px, 6px, 0px;
    }

    /* The colored box specifically for the temperature */
    .temp-box {
      padding: 6px 6px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
  </style>

      { temp: 20,  color: [230, 206, 120] }, // Yellow
      { temp: 30,  color: [220, 166, 130] }, // Orange
      { temp: 40,  color: [220, 130, 130] }, // Red
      { temp: 50,  color: [206, 184, 184] }  // Pinky Red
    ];

    function interpolate(start, end, t) {
      return start + (end - start) * t;
    }

    function getTemperatureColor(temp) {
      if (typeof temp !== 'number' || isNaN(temp)) return 'rgba(100, 100, 100, 0.9)'; // Neutral grey for fallback

      if (temp <= colorScale[0].temp) return `rgb(${colorScale[0].color.join(',')})`;
      if (temp >= colorScale[colorScale.length - 1].temp) return `rgb(${colorScale[colorScale.length - 1].color.join(',')})`;

      let lower, upper;
      for (let i = 0; i < colorScale.length - 1; i++) {
        if (temp >= colorScale[i].temp && temp <= colorScale[i + 1].temp) {
          lower = colorScale[i];
          upper = colorScale[i + 1];
          break;
        }
      }

      const range = upper.temp - lower.temp;
      const adjustedTemp = temp - lower.temp;
      const t = adjustedTemp / range;

      const r = Math.round(interpolate(lower.color[0], upper.color[0], t));
      const g = Math.round(interpolate(lower.color[1], upper.color[1], t));
      const b = Math.round(interpolate(lower.color[2], upper.color[2], t));

      return `rgba(${r}, ${g}, ${b}, 0.9)`;
    }

      .htmlElementsData([]) 
      .htmlElement(d => { 
        const el = document.createElement('div'); 
        el.className = 'weather-badge'; 
        const bgColor = getTemperatureColor(d.temp); 
        const displayTemp = typeof d.temp === 'number' ? `${d.temp}°` : '--';

        const offsetY = d.offsetY || 0;
        el.style.transform = `translate(-50%, calc(-100% + ${offsetY}px))`;

        `; 
        return el;

    async function getWeatherForCities(cities) { 
      const CACHE_TTL = 60 * 60 * 1000; // 60 minutes
      const now = Date.now();

      const cachedRaw = sessionStorage.getItem('weather_cache');
      const cache = cachedRaw ? JSON.parse(cachedRaw) : {};

      const missingCities = [];
      const resultsMap = {};

      // Check cache first
      cities.forEach(city => {
        const key = `${city.lat}_${city.lng}`;
        if (cache[key] && (now - cache[key].timestamp < CACHE_TTL)) {
          resultsMap[key] = cache[key].temp;
        } else {
          missingCities.push(city);
        }
      });

      // If all cities are already cached, return immediately
      if (missingCities.length === 0) {
        return cities.map(city => ({
          ...city,
          temp: resultsMap[`${city.lat}_${city.lng}`]
        }));
      }

      // Fetch missing cities
      try { 
        const lats = missingCities.map(c => c.lat).join(','); 
        const lngs = missingCities.map(c => c.lng).join(','); 

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current_weather=true`; 
        const res = await fetch(url); 
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json(); 
        
        missingCities.forEach((city, idx) => {
          let rawTemp;
          if (Array.isArray(data)) {
            rawTemp = data[idx]?.current_weather?.temperature;
          } else if (Array.isArray(data.current_weather)) {
            rawTemp = data.current_weather[idx]?.temperature;
          } else {
            rawTemp = data.current_weather?.temperature;
          }

          const parsedTemp = (rawTemp !== undefined && rawTemp !== null) ? Math.round(rawTemp) : '--';
          const key = `${city.lat}_${city.lng}`;

          cache[key] = { temp: parsedTemp, timestamp: now };
          resultsMap[key] = parsedTemp;
        });

        sessionStorage.setItem('weather_cache', JSON.stringify(cache));

      } catch (err) { 
        console.error("Weather fetch failed (Rate limit or network error). Using fallback.", err); 
        
        // Fallback: populate un-cached cities with '--' so they still display on the globe
        missingCities.forEach(city => {
          resultsMap[`${city.lat}_${city.lng}`] = '--';
        });
      } 

      return cities.map(city => ({
        ...city,
        temp: resultsMap[`${city.lat}_${city.lng}`]
      }));
    } 

    let currentStopIndex = 0; 
    const FLY_DURATION = 3500; 
    const SHORT_FLY_DURATION = 800; // used when consecutive stops share roughly the same view
    const PAUSE_DURATION = 6000; 
    const CAMERA_SIMILARITY_THRESHOLD = 8; // degrees lat/lng combined — below this, treat as the same general view

    function cameraDistance(a, b) {
      const dLat = a.lat - b.lat;
      const dLng = a.lng - b.lng;
      return Math.sqrt(dLat * dLat + dLng * dLng);
    }

    // --- PAUSE / PLAY ---
    let paused = false;

    // Waits `ms` of *active* time — time spent paused doesn't count, so
    // pressing pause genuinely freezes the countdown rather than just
    // pushing everything back by the length of the pause.
    function wait(ms) {
      return new Promise(resolve => {
        let remaining = ms;
        let lastTick = null;

        function tick(now) {
          if (lastTick === null) lastTick = now;
          const delta = now - lastTick;
          lastTick = now;

          if (!paused) remaining -= delta;

          if (remaining <= 0) {
            resolve();
          } else {
            requestAnimationFrame(tick);
          }
        }

        requestAnimationFrame(tick);
      });
    }

    async function runWeatherTour() { 
      while (true) {
        const stop = STOPS[currentStopIndex]; 
        const prevStop = STOPS[(currentStopIndex - 1 + STOPS.length) % STOPS.length];

        // If this stop's camera view is close to the previous one, skip
        // most of the flight time rather than doing a full slow pan.
        const isShortHop = cameraDistance(stop.lookAt, prevStop.lookAt) < CAMERA_SIMILARITY_THRESHOLD;
        const flyDuration = isShortHop ? SHORT_FLY_DURATION : FLY_DURATION;

        // Remove previous markers while rotating 
        world.htmlElementsData([]); 

        // Move camera 
        world.pointOfView(stop.lookAt, flyDuration); 

        // Fetch new data while the camera moves 
        const weatherDataPromise = getWeatherForCities(stop.cities); 

        await wait(flyDuration);
        const weatherData = await weatherDataPromise;

        // Render weather badges once arrived 
        world.htmlElementsData(weatherData); 

        await wait(PAUSE_DURATION);

        currentStopIndex = (currentStopIndex + 1) % STOPS.length; 
      }
    } 

    // Start tour 
    runWeatherTour(); 

    // Pause / play toggle 
    const pauseToggle = document.getElementById('pause-toggle'); 
    pauseToggle.addEventListener('click', () => { 
      paused = !paused; 
      pauseToggle.textContent = paused ? '▶' : '❙❙'; 
      pauseToggle.setAttribute('aria-label', paused ? 'Resume tour' : 'Pause tour');
