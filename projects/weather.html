    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #006;
      overflow: hidden;
    }

    #globe-container {
      width: 100vw;
      height: 100vh;
    }

    #pause-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(10, 20, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.55;
      transition: opacity 0.2s ease, background 0.2s ease;
      z-index: 10;
    }

    #pause-toggle:hover {
      opacity: 1;
      background: rgba(10, 20, 30, 0.9);
    }

    #mode-caption {
      position: fixed;
      top: 24px;
      left: 5%;
      background: rgba(250, 250, 250, 0.9);
      color: #333;
      text-transform: uppercase;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 4px;
      padding: 6px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-right: 4px solid #09c;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      user-select: none;
      z-index: 10;
      transition: opacity 0.15s ease;
    }

    #mode-caption:hover {
      opacity: 0.85;
    }

    /* Desktop floating city badges */
    .weather-badge {
      background: rgba(250, 250, 250, 0.9);
      color: #fff;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 0;
    }

    .weather-badge strong {
      color: #333;
      text-transform: uppercase;
      font-weight: 600;
      margin: 0 6px;
    }

    /* Desktop temperature boxes */
    .temp-box {
      padding: 6px 6px;
      font-weight: bold;
      color: #fff;
      border-radius: 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .temp-box:only-child {
      border-radius: 0 4px 4px 0;
    }

    .temp-box:last-child {
      border-radius: 0 4px 4px 0;
    }

    /* Mobile weather panel */
    #mobile-weather-panel {
      display: none;
    }

    /* Mobile geographic placemarks */
    .mobile-city-marker {
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      white-space: nowrap;
    }

    .mobile-city-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(20, 30, 40, 0.8);
      box-sizing: border-box;
      flex: 0 0 auto;
    }

    .mobile-city-label {
      background: rgba(20, 30, 40, 0.62);
      color: rgba(255, 255, 255, 0.92);
      border-radius: 3px;
      padding: 2px 4px;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 500;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Mobile layout */
    @media (max-width: 600px) {
      #mobile-weather-panel {
        position: fixed;
        display: block;
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-height: 36vh;
        background: rgba(10, 20, 30, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 7px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        color: #fff;
        overflow-y: auto;
        z-index: 100;
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        scrollbar-width: thin;
      }

      #mobile-weather-panel.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .mobile-weather-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .mobile-weather-row {
        min-width: 0;
        min-height: 31px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 4px 7px 4px 9px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .mobile-weather-row:nth-child(odd) {
        border-right: 1px solid rgba(255, 255, 255, 0.1);
      }

      .mobile-city-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        font-weight: 500;

    // --- COLOR SCALE LOGIC ---

    const colorScale = [
      { temp: -30, color: [241, 223, 245] },
      { temp: -20, color: [175, 100, 190] },
      { temp: -10, color: [100, 109, 190] },
      { temp: 0,   color: [142, 189, 208] },
      { temp: 10,  color: [100, 190, 109] },
      { temp: 20,  color: [230, 206, 120] },
      { temp: 30,  color: [220, 166, 130] },
      { temp: 40,  color: [220, 130, 130] },
      { temp: 50,  color: [206, 184, 184] }
    ];

    function interpolate(start, end, t) {
      return start + (end - start) * t;
    }

    function getTemperatureColor(temp) {
      if (typeof temp !== 'number' || isNaN(temp)) {
        return 'rgba(100, 100, 100, 0.9)';
      }

      if (temp <= colorScale[0].temp) {
        return `rgb(${colorScale[0].color.join(',')})`;
      }

      if (temp >= colorScale[colorScale.length - 1].temp) {
        return `rgb(${colorScale[colorScale.length - 1].color.join(',')})`;
      }

      let lower, upper;

      for (let i = 0; i < colorScale.length - 1; i++) {
        if (temp >= colorScale[i].temp && temp <= colorScale[i + 1].temp) {
          lower = colorScale[i];
          upper = colorScale[i + 1];
          break;
        }
      }

      const range = upper.temp - lower.temp;
      const adjustedTemp = temp - lower.temp;
      const t = adjustedTemp / range;

      const r = Math.round(interpolate(lower.color[0], upper.color[0], t));
      const g = Math.round(interpolate(lower.color[1], upper.color[1], t));
      const b = Math.round(interpolate(lower.color[2], upper.color[2], t));

      return `rgba(${r}, ${g}, ${b}, 0.9)`;
    }

    // --- END COLOR SCALE LOGIC ---

    let displayMode = 'current';
    let latestWeatherData = [];

    function renderTempHtml(d) {
      if (displayMode === 'forecast') {
        const hi = typeof d.high === 'number' ? d.high : null;
        const lo = typeof d.low === 'number' ? d.low : null;

        const hiColor = hi !== null
          ? getTemperatureColor(hi)
          : 'rgba(100, 100, 100, 0.9)';

        const loColor = lo !== null
          ? getTemperatureColor(lo)
          : 'rgba(100, 100, 100, 0.9)';

        const hiText = hi !== null ? `${hi}°` : '--';
        const loText = lo !== null ? `${lo}°` : '--';

        return `
          <span class="temp-box" style="background-color: ${loColor}">${loText}</span>
          <span class="temp-box" style="background-color: ${hiColor}">${hiText}</span>
        `;
      }

      const bgColor = getTemperatureColor(d.temp);
      const displayTemp = typeof d.temp === 'number' ? `${d.temp}°` : '--';

      return `
        <span class="temp-box" style="background-color: ${bgColor}">
          ${displayTemp}
        </span>
      `;
    }

          { name: "Brasília", lat: -15.80, lng: -47.88 },
          { name: "Buenos Aires", lat: -34.60, lng: -58.38 },
          { name: "Caracas", lat: 10.51, lng: -66.91 },
          { name: "Guayaquil", lat: -2.19, lng: -79.89 },
          { name: "Lima", lat: -12.04, lng: -77.04 },
          { name: "Manaus", lat: -3.11, lng: -60.02 },
          { name: "Paramaribo", lat: 5.85, lng: -55.20 },
          { name: "Rio de Janeiro", lat: -22.90, lng: -43.17, offsetY: -18 },
          { name: "Santa Cruz", lat: -17.80, lng: -63.18 },
          { name: "Santiago", lat: -33.44, lng: -70.66, forecastShiftX: -32 },
          { name: "São Paulo", lat: -23.53, lng: -46.63, offsetY: 18 }
        ]
      }
    ];

    // --- MOBILE DETECTION ---

    const mobileQuery = window.matchMedia('(max-width: 600px)');

    function isMobile() {
      return mobileQuery.matches;
    }

    // --- GLOBE ---

    const world = Globe()(document.getElementById('globe-container'))
    .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')  .bumpImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
    .backgroundImageUrl('//cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png')
      .htmlElementsData([])
      .htmlElement(d => {

        /*
          Desktop:
          Return the existing weather badge with its existing offsets.

          Mobile:
          Return a small geographic placemark. The city's actual latitude
          and longitude are therefore the only positioning information used.
          offsetY and forecastShiftX are deliberately ignored.
        */

        const wrapper = document.createElement('div');

        wrapper.style.position = 'relative';
        wrapper.style.width = '0px';
        wrapper.style.height = '0px';

        if (isMobile()) {
          const marker = document.createElement('div');
          marker.className = 'mobile-city-marker';

          const dot = document.createElement('span');
          dot.className = 'mobile-city-dot';

          const label = document.createElement('span');
          label.className = 'mobile-city-label';
          label.textContent = d.name;

          marker.appendChild(dot);
          marker.appendChild(label);
          wrapper.appendChild(marker);

          return wrapper;
        }

        const el = document.createElement('div');
        el.className = 'weather-badge';

        const offsetY = d.offsetY || 0;
        const forecastShiftX = displayMode === 'forecast'
          ? (d.forecastShiftX ?? 0)
          : 0;

        el.style.position = 'absolute';
        el.style.left = '0';
        el.style.top = '0';
        el.style.transform =
          `translate(calc(-50% + ${forecastShiftX}px), calc(-100% + ${offsetY}px))`;

        el.innerHTML = `
          <strong>${d.name}</strong>
          ${renderTempHtml(d)}
        `;

        wrapper.appendChild(el);
        return wrapper;
      });

    // --- WEATHER DATA ---

    async function getWeatherForCities(cities) {
      const CACHE_TTL = 60 * 60 * 1000;
      const now = Date.now();

      const cachedRaw = sessionStorage.getItem('weather_cache_v2');
      const cache = cachedRaw ? JSON.parse(cachedRaw) : {};

      const missingCities = [];
      const resultsMap = {};

      cities.forEach(city => {
        const key = `${city.lat}_${city.lng}`;

        if (cache[key] && (now - cache[key].timestamp < CACHE_TTL)) {
          resultsMap[key] = cache[key];
        } else {
          missingCities.push(city);
        }
      });

      if (missingCities.length === 0) {
        return cities.map(city => ({
          ...city,
          ...resultsMap[`${city.lat}_${city.lng}`]
        }));
      }

      try {
        const lats = missingCities.map(c => c.lat).join(',');
        const lngs = missingCities.map(c => c.lng).join(',');

        const url =
          `https://api.open-meteo.com/v1/forecast?latitude=${lats}` +
          `&longitude=${lngs}` +
          `&current_weather=true` +
          `&daily=temperature_2m_max,temperature_2m_min` +
          `&timezone=auto` +
          `&forecast_days=1`;

        const res = await fetch(url);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();

        missingCities.forEach((city, idx) => {
          const entry = Array.isArray(data) ? data[idx] : data;

          const rawTemp = entry?.current_weather?.temperature;
          const rawHigh = entry?.daily?.temperature_2m_max?.[0];
          const rawLow = entry?.daily?.temperature_2m_min?.[0];

          const parsedTemp =
            (rawTemp !== undefined && rawTemp !== null)
              ? Math.round(rawTemp)
              : '--';

          const parsedHigh =
            (rawHigh !== undefined && rawHigh !== null)
              ? Math.round(rawHigh)
              : '--';

          const parsedLow =
            (rawLow !== undefined && rawLow !== null)
              ? Math.round(rawLow)
              : '--';

          const key = `${city.lat}_${city.lng}`;

          const record = {
            temp: parsedTemp,
            high: parsedHigh,
            low: parsedLow,
            timestamp: now
          };

          cache[key] = record;
          resultsMap[key] = record;
        });

        sessionStorage.setItem('weather_cache_v2', JSON.stringify(cache));

      } catch (err) {
        console.error(
          "Weather fetch failed (Rate limit or network error). Using fallback.",
          err
        );

        missingCities.forEach(city => {
          resultsMap[`${city.lat}_${city.lng}`] = {
            temp: '--',
            high: '--',
            low: '--',
            timestamp: now
          };
        });
      }

      return cities.map(city => ({
        ...city,
        ...resultsMap[`${city.lat}_${city.lng}`]
      }));
    }

    // --- MOBILE WEATHER PANEL ---

    function renderMobileWeatherPanel(weatherData) {
      const grid = document.getElementById('mobile-weather-grid');

      if (!grid) return;

      grid.innerHTML = weatherData.map(d => {

        if (displayMode === 'forecast') {
          const lo = typeof d.low === 'number' ? d.low : null;
          const hi = typeof d.high === 'number' ? d.high : null;

          const loColor = lo !== null
            ? getTemperatureColor(lo)
            : 'rgba(100, 100, 100, 0.9)';

          const hiColor = hi !== null
            ? getTemperatureColor(hi)
            : 'rgba(100, 100, 100, 0.9)';

          const loText = lo !== null ? `${lo}°` : '--';
          const hiText = hi !== null ? `${hi}°` : '--';

          return `
            <div class="mobile-weather-row">
              <span class="mobile-city-name">${d.name}</span>
              <span class="mobile-temperature">
                <span class="mobile-temp-box" style="background-color: ${loColor}">
                  ${loText}
                </span>
                <span class="mobile-temp-box" style="background-color: ${hiColor}">
                  ${hiText}
                </span>
              </span>
            </div>
          `;
        }

        const temp = typeof d.temp === 'number' ? d.temp : null;

        const tempColor = temp !== null
          ? getTemperatureColor(temp)
          : 'rgba(100, 100, 100, 0.9)';

        const tempText = temp !== null ? `${temp}°` : '--';

        return `
          <div class="mobile-weather-row">
            <span class="mobile-city-name">${d.name}</span>
            <span class="mobile-temperature">
              <span class="mobile-temp-box" style="background-color: ${tempColor}">
                ${tempText}
              </span>
            </span>
          </div>
        `;
      }).join('');
    }

    function showMobileWeatherPanel(weatherData) {
      if (!isMobile()) return;

      renderMobileWeatherPanel(weatherData);

      const panel = document.getElementById('mobile-weather-panel');
      panel.classList.add('visible');
    }

    function hideMobileWeatherPanel() {
      const panel = document.getElementById('mobile-weather-panel');

      if (panel) {
        panel.classList.remove('visible');
      }
    }

    // --- TOUR ---

    let currentStopIndex = 0;

    const FLY_DURATION = 3500;
    const SHORT_FLY_DURATION = 800;
    const PAUSE_DURATION = 6000;
    const CAMERA_SIMILARITY_THRESHOLD = 8;

    // Pull the globe farther back on narrow screens so the full
    // geographical spread of each stop remains visible.
    const MOBILE_ALTITUDE_MULTIPLIER = 1.45;

    function cameraDistance(a, b) {
      const dLat = a.lat - b.lat;
      const dLng = a.lng - b.lng;

      return Math.sqrt(dLat * dLat + dLng * dLng);
    }

    // --- PAUSE / PLAY ---

    let paused = false;

    function wait(ms) {
      return new Promise(resolve => {
        let remaining = ms;
        let lastTick = null;

        function tick(now) {
          if (lastTick === null) lastTick = now;

          const delta = now - lastTick;
          lastTick = now;

          if (!paused) remaining -= delta;

          if (remaining <= 0) {
            resolve();
          } else {
            requestAnimationFrame(tick);
          }
        }

        requestAnimationFrame(tick);
      });
    }

    async function runWeatherTour() {
      while (true) {
        const stop = STOPS[currentStopIndex];
        const prevStop =
          STOPS[(currentStopIndex - 1 + STOPS.length) % STOPS.length];

        const isShortHop =
          cameraDistance(stop.lookAt, prevStop.lookAt) <
          CAMERA_SIMILARITY_THRESHOLD;

        const flyDuration =
          isShortHop ? SHORT_FLY_DURATION : FLY_DURATION;

        // Hide everything while the camera is travelling.
        world.htmlElementsData([]);
        hideMobileWeatherPanel();

        // Pull the camera back on mobile only.
        const cameraView = isMobile()
          ? {
              ...stop.lookAt,
              altitude: stop.lookAt.altitude * MOBILE_ALTITUDE_MULTIPLIER
            }
          : stop.lookAt;

        world.pointOfView(cameraView, flyDuration);

        // Fetch new data while the camera moves.
        const weatherDataPromise = getWeatherForCities(stop.cities);

        await wait(flyDuration);

        const weatherData = await weatherDataPromise;

        latestWeatherData = weatherData;

        // Desktop: weather badges.
        // Mobile: geographic city placemarks.
        world.htmlElementsData(weatherData);

        // Mobile: weather information panel.
        showMobileWeatherPanel(weatherData);

        await wait(PAUSE_DURATION);

        currentStopIndex =
          (currentStopIndex + 1) % STOPS.length;
      }
    }

    // Start tour.
    runWeatherTour();

    // --- PAUSE / PLAY ---

    const pauseToggle = document.getElementById('pause-toggle');

    pauseToggle.addEventListener('click', () => {
      paused = !paused;

      pauseToggle.textContent =
        paused ? '▶' : '❙❙';

      pauseToggle.setAttribute(
        'aria-label',
        paused ? 'Resume tour' : 'Pause tour'
      );
    });

    // --- NOW / FORECAST TOGGLE ---

    const modeCaption = document.getElementById('mode-caption');

    modeCaption.addEventListener('click', () => {
      displayMode =
        displayMode === 'current'
          ? 'forecast'
          : 'current';

      modeCaption.textContent =
        displayMode === 'forecast'
          ? 'FORECAST'
          : 'NOW';

      // Desktop badges need to be recreated so their forecast
      // offsets and temperature boxes are recalculated.
      //
      // Mobile placemarks do not change, but recreating the data
      // keeps the rendering state consistent.
      world.htmlElementsData([]);
      world.htmlElementsData(latestWeatherData);

      // Update the mobile weather panel without fetching again.
      if (isMobile() && latestWeatherData.length) {
        renderMobileWeatherPanel(latestWeatherData);
      }
    });

    // --- RESPONSIVE SWITCHING ---

    mobileQuery.addEventListener('change', () => {
      if (!latestWeatherData.length) return;

      // Re-render the globe so switching between desktop and
      // mobile changes the marker type.
      world.htmlElementsData([]);
      world.htmlElementsData(latestWeatherData);

      if (isMobile()) {
        showMobileWeatherPanel(latestWeatherData);
      } else {
        hideMobileWeatherPanel();
      }
    });
  </script>
</body>
</html>
