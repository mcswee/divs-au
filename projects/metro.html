<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melbourne Train Departures — divs.au</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #ffffff;
      --text:       #111111;
      --dim:        #666666;
      --border:     #e0e0e0;
      --row-hover:  #f7f7f7;
      --plat-bg:    #f2f2f2;
      --pat-bg:     #f8f8f8;
      --font:       'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
    }

    /* ── Header ── */
    header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.5rem 0 1.25rem;
      border-bottom: 2px solid var(--text);
      margin-bottom: 1.75rem;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .site-tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    #clock {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    /* ── Station selector ── */
    .selector-wrap {
      position: relative;
    }

    .selector-wrap::after {
      content: '▾';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--dim);
      pointer-events: none;
      font-size: 0.85rem;
    }

    #station-select {
      width: 100%;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 1.5rem 0.35rem 0;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
    }

    #station-select:focus { border-bottom-color: var(--text); }

    /* ── Status messages ── */
    .msg {
      padding: 2rem 0;
      color: var(--dim);
      font-size: 0.9rem;
    }

    /* ── Alerts ── */
    .alerts { margin-bottom: 1.25rem; }

    .alert {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: start;
      gap: 0.6rem;
      padding: 0.7rem 0.875rem;
      border: 2px solid #e67e00;
      border-left-width: 10px;
      border-radius: 2px;
      background: #1a1a1a;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      margin-bottom: 3px;
    }
    
    .alert-icon {
      font-size: 0.85rem;
      line-height: 1.3;
      flex-shrink: 0;
    }

    .alert-hdr {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      color: #ffffff;
    }

    .alert-desc {
      font-size: 0.8rem;
      color: #f0f0f0;
      line-height: 1.4;
      margin-top: 0.25rem;
      display: none;
      grid-column: 2;
    }

    .alert.expanded .alert-desc { display: block; }

    .alert-caret {
      font-size: 0.6rem;
      color: #aaaaaa;
      padding-top: 0.2rem;
    }

    /* ── Platform section ── */
    .platform { margin-bottom: 1.25rem; }

    .platform-hdr {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      background: var(--plat-bg);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
    }

    /* ── Departure row ── */
    .dep {
      display: grid;
      grid-template-columns: 2.75rem 3.8rem 1fr auto;
      align-items: center;
      gap: 0.875rem;
      padding: 0.8rem 0.75rem;
      border-bottom: 1px solid var(--border);
      border-left: 4px solid var(--lc, #ccc);
      cursor: pointer;
      transition: background 0.08s;
      user-select: none;
      -webkit-user-select: none;
    }

    .dep:hover, .dep.open { background: var(--row-hover); }

    .dep-time {
      font-size: 0.9rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      text-align: center;
    }

    .dep-time.delayed .sched {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--dim);
      text-decoration: line-through;
      display: block;
    }

    .dep-time .actual { display: block; }

    .dep-mins {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      background: #111111;
      color: #ffffff;
      padding: 0.15rem 0.4rem;
      margin: 0rem 0.2rem;
      border-radius: 2px;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .dep-mins.soon { color: #e67e00; }

    .dep-info { min-width: 0; }

    .dep-dest {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dep-route {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--dim);
      margin-top: 0.1rem;
    }

    .route-badge {
      display: inline-block;
      color: #ffffff;
      background-color: var(--lc, #ccc);
      padding: 0.1rem 0.35rem;
      border-radius: 2px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .dep-caret {
      font-size: 0.6rem;
      color: var(--dim);
      padding-left: 0.25rem;
    }

    /* ── Real-time badges ── */
    .rt-ontime {
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--dim);
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .rt-late {
      font-size: 0.72rem;
      font-weight: 600;
      color: #e67e00;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .rt-early {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--dim);
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    /* ── Stopping pattern ── */
    .pattern {
      background: var(--pat-bg);
      border-bottom: 1px solid var(--border);
      border-left: 4px solid var(--lc, #ccc);
      padding: 0.5rem 0;
    }

    .pat-stop {
      display: grid;
      grid-template-columns: 2.75rem 1fr;
      gap: 0.875rem;
      padding: 0.275rem 0.75rem;
      font-size: 0.83rem;
    }

    .pat-stop.is-here { font-weight: 700; }
    .pat-stop.is-end  { font-weight: 600; }

    .pat-time {
      font-variant-numeric: tabular-nums;
      color: var(--dim);
    }

    .pat-stop.is-here .pat-time,
    .pat-stop.is-end  .pat-time { color: var(--text); }

    .pat-express {
      padding: 0.3rem 0.75rem;
      font-size: 0.78rem;
      font-style: italic;
      color: var(--dim);
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      margin: 0.1rem 0;
    }

    .pat-loading {
      padding: 0.5rem 0.75rem;
      font-size: 0.83rem;
      color: var(--dim);
    }

    /* ── Footer ── */
    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    footer a { color: inherit; text-decoration: underline; }

    .live-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .live-dot.connected { background: #22c55e; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .dep {
        grid-template-columns: 2.5rem 3.5 1fr auto;
        gap: 0.45rem;
        padding: 0.7rem 0.45rem;
      }
      h1, #clock { font-size: 1.25rem; }
      .dep-dest { font-size: 0.875rem; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-top">
      <div class="wordmark">
        <span class="site-tag"><a href="/projects/">divs.au</a></span>
        <h1>Melbourne Trains</h1>
      </div>
      <div id="clock"></div>
    </div>
    <div class="selector-wrap">
      <select id="station-select" aria-label="Select station">
        <option value="">Select a station…</option>
      </select>
    </div>
  </header>

  <main id="board" aria-live="polite">
    <p class="msg">Select a station to see upcoming departures.</p>
  </main>

  <footer>
    <span>
      Data: <a href="https://opendata.transport.vic.gov.au/dataset/gtfs-schedule" target="_blank" rel="noopener">GTFS Schedule</a> &amp; <a href="https://opendata.transport.vic.gov.au/dataset/gtfs-realtime" target="_blank" rel="noopener">GTFS Realtime</a>.
      For official times and disruptions see <a href="https://www.transportvic.com.au" target="_blank" rel="noopener">Transport Victoria</a>.
    </span>
    <span id="live-indicator" title="Live data status">
      <span class="live-dot" id="live-dot"></span>
    </span>
  </footer>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const DATA = '/assets/data/trains';
const RT   = 'https://melb-trains-rt.dj-mcsw-ee.workers.dev/';
const POLL = 30_000;

// ── State ─────────────────────────────────────────────────────────────────────
let stations    = [];
let stationData = null;
let openTrip    = null;
let patCache    = {};
let rtData      = null;
let rtLookup    = {};   // "ROUTE|tripnum" → delay seconds
let rtNumLookup = {};   // "tripnum" → delay seconds (fallback for cross-route short workings)

// ── Boot ──────────────────────────────────────────────────────────────────────
(async () => {
  tick();
  setInterval(tick, 15_000);
  pollRT();
  setInterval(pollRT, POLL);
  try {
    const r = await fetch(`${DATA}/stations.json`);
    const d = await r.json();
    stations = d.stations;
    buildDropdown(stations);
  } catch {
    setBoard('<p class="msg">Could not load station list.</p>');
  }
  document.getElementById('station-select')
    .addEventListener('change', e => loadStation(e.target.value));
})();

// ── Dropdown ──────────────────────────────────────────────────────────────────
function buildDropdown(list) {
  const sel = document.getElementById('station-select');
  list.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.name;
    sel.appendChild(o);
  });
}

// ── Load station ──────────────────────────────────────────────────────────────
async function loadStation(id) {
  if (!id) { setBoard('<p class="msg">Select a station to see upcoming departures.</p>'); return; }
  setBoard('<p class="msg">Loading…</p>');
  openTrip = null;
  try {
    const r = await fetch(`${DATA}/departures_${safeFn(id)}.json`);
    stationData = await r.json();
    render();
  } catch {
    setBoard('<p class="msg">Could not load departures for this station.</p>');
  }
}

// ── Real-time ─────────────────────────────────────────────────────────────────
// PTV rolls the period number in trip IDs regularly without changing trip numbers.
// e.g. "02-FKN--1-T5-4564" becomes "02-FKN--56-T5-4564" after an update.
// We build a lookup keyed on stable parts only: route + service type + trip number.

function stableKey(tripId) {
  // Standard format: "02-FKN--56-T5-4564" → "FKN|4564"
  if (tripId.startsWith('0')) {
    const p = tripId.split('-');
    if (p.length >= 6) return `${p[1]}|${p[5]}`;
    return null;
  }
  // Non-standard format: "vic:02BEG:_:H:vpt._Belgrave_3445_20260730" → "BEG|3445"
  const m = tripId.match(/vic:0[12]([A-Z]+):.*?_(\d+)_\d{8}/);
  if (m) return `${m[1]}|${m[2]}`;
  return null;
}

function tripNum(tripId) {
  if (tripId.startsWith('0')) {
    const p = tripId.split('-');
    return p.length >= 6 ? p[5] : null;
  }
  const m = tripId.match(/_(\d+)_\d{8}/);
  return m ? m[1] : null;
}

function buildRtLookup() {
  rtLookup = {};
  rtNumLookup = {};
  if (!rtData?.trips) return;
  for (const [id, data] of Object.entries(rtData.trips)) {
    const key = stableKey(id);
    if (key !== null) rtLookup[key] = data.delay;
    const num = tripNum(id);
    if (num !== null) rtNumLookup[num] = data.delay;
  }
}

function rtDelay(tripId) {
  // 1. Exact match
  const exact = rtData?.trips?.[tripId];
  if (exact !== undefined) return exact.delay;
  // 2. Route + trip number (ignores period and service type)
  const key = stableKey(tripId);
  if (key !== null && key in rtLookup) return rtLookup[key];
  // 3. Trip number only — catches cross-route short workings
  //    e.g. static has LIL|3445, RT publishes as BEG|3445
  const num = tripNum(tripId);
  if (num !== null && num in rtNumLookup) return rtNumLookup[num];
  return null;
}

async function pollRT() {
  try {
    const r = await fetch(RT);
    rtData = await r.json();
    buildRtLookup();
    const dot = document.getElementById('live-dot');
    if (dot) dot.classList.add('connected');
    if (stationData) render();
  } catch {
    const dot = document.getElementById('live-dot');
    if (dot) dot.classList.remove('connected');
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  if (!stationData) return;

  const nowMin   = nowMins();
  const today    = dayType();
  const todayNum = todayDate();

  const raw = stationData.departures.filter(d => {
    if (!d.days[today]) return false;
    if (d.days.from  && todayNum < d.days.from)  return false;
    if (d.days.until && todayNum > d.days.until) return false;
    const t = hm2min(d.departs);
    if (t >= 1440) return false;
    const delay  = rtDelay(d.trip_id) ?? 0;
    const actual = t + Math.round(delay / 60);
    return actual >= nowMin - 1;
  });

  // Deduplicate: multiple calendar variants of the same trip exist in static data.
  // Keep the variant that has an RT match if possible; otherwise keep the first.
  const bestVariant = {};
  raw.forEach(d => {
    const key = `${d.plat}|${d.departs}|${d.route}`;
    if (!bestVariant[key]) {
      bestVariant[key] = d;
    } else if (rtDelay(d.trip_id) !== null && rtDelay(bestVariant[key].trip_id) === null) {
      bestVariant[key] = d;  // upgrade to the RT-matched variant
    }
  });
  const upcoming = Object.values(bestVariant)
    .sort((a, b) => hm2min(a.departs) - hm2min(b.departs));

  const byPlat = {};
  upcoming.forEach(d => {
    const p = d.plat || '—';
    if (!byPlat[p]) byPlat[p] = [];
    if (byPlat[p].length < 3) byPlat[p].push(d);
  });

  const plats = Object.keys(byPlat).sort(platSort);
  const frag  = document.createDocumentFragment();

  const stationAlerts = alertsForStation();
  if (stationAlerts.length) frag.appendChild(buildAlerts(stationAlerts));

  if (!plats.length) {
    const msg = el('p', 'msg');
    msg.textContent = stationAlerts.length
      ? 'No train services currently running — see alert above.'
      : 'No upcoming services for today.';
    frag.appendChild(msg);
    const board = document.getElementById('board');
    board.innerHTML = '';
    board.appendChild(frag);
    return;
  }

  plats.forEach(p => frag.appendChild(buildPlatform(p, byPlat[p])));

  const board = document.getElementById('board');
  board.innerHTML = '';
  board.appendChild(frag);
}

// ── Alerts ────────────────────────────────────────────────────────────────────
const ROUTE_CODES = {
  'Frankston': 'FKN', 'Stony Point': 'STY',
  'Belgrave': 'BEG', 'Lilydale': 'LIL', 'Alamein': 'ALM', 'Glen Waverley': 'GWY',
  'Craigieburn': 'CGB', 'Upfield': 'UFD',
  'Mernda': 'MDD', 'Hurstbridge': 'HBE',
  'Pakenham': 'PKM', 'Cranbourne': 'CBE', 'Sunbury': 'SUY',
  'Sandringham': 'SHM', 'Werribee': 'WER', 'Williamstown': 'WIL',
  'Flemington Racecourse': 'FGS',
};

const SHOW_EFFECTS = new Set([
  'NO_SERVICE', 'REDUCED_SERVICE', 'SIGNIFICANT_DELAYS', 'MODIFIED_SERVICE', 'OTHER_EFFECT'
]);

function alertsForStation() {
  if (!rtData?.alerts?.length || !stationData) return [];
  const codes = new Set(
    stationData.departures.map(d => ROUTE_CODES[d.route]).filter(Boolean)
  );

  const matched = rtData.alerts.filter(a => {
    if (!SHOW_EFFECTS.has(a.effect)) return false;
    if (a.effect === 'OTHER_EFFECT' && a.header.startsWith('Planned work')) return false;
    return a.routes.some(r => [...codes].some(c => r.includes(`-${c}`)));
  });

  // Deduplicate: same ID appearing twice, or same description (different route entries)
  const seenIds   = new Set();
  const seenDescs = new Set();
  return matched.filter(a => {
    if (seenIds.has(a.id))           return false;
    if (seenDescs.has(a.description)) return false;
    seenIds.add(a.id);
    seenDescs.add(a.description);
    return true;
  });
}

function buildAlerts(alerts) {
  const container = el('div', 'alerts');
  alerts.forEach(a => {
    const item  = el('div', 'alert');
    const icon  = el('span', 'alert-icon');
    icon.textContent = '⚠️';
    const main  = el('div', 'alert-main');
    const hdr   = el('div', 'alert-hdr');
    hdr.textContent = a.header;
    const desc  = el('div', 'alert-desc');
    desc.textContent = a.description;
    main.append(hdr, desc);
    const caret = el('span', 'alert-caret');
    caret.textContent = '▼';
    item.append(icon, main, caret);
    item.addEventListener('click', () => {
      item.classList.toggle('expanded');
      caret.textContent = item.classList.contains('expanded') ? '▲' : '▼';
    });
    container.appendChild(item);
  });
  return container;
}

function effectClass(effect) {
  if (effect === 'NO_SERVICE')         return 'critical';
  if (effect === 'REDUCED_SERVICE')    return 'critical';
  if (effect === 'SIGNIFICANT_DELAYS') return 'warning';
  if (effect === 'MODIFIED_SERVICE')   return 'info';
  if (effect === 'OTHER_EFFECT')       return 'warning';
  return 'info';
}

// ── Platform ──────────────────────────────────────────────────────────────────
function buildPlatform(plat, services) {
  const sec = el('section', 'platform');
  const hdr = el('div', 'platform-hdr');
  hdr.textContent = plat === '—' ? 'Platform unknown' : `Platform ${plat}`;
  sec.appendChild(hdr);
  services.forEach(dep => {
    sec.appendChild(buildDep(dep));
    if (openTrip === dep.trip_id) sec.appendChild(buildPattern(dep));
  });
  return sec;
}

// ── Departure row ─────────────────────────────────────────────────────────────
function buildDep(dep) {
  const row = el('div', 'dep' + (openTrip === dep.trip_id ? ' open' : ''));
  row.style.setProperty('--lc', dep.colour);
  row.setAttribute('role', 'button');
  row.setAttribute('tabindex', '0');

  const nowMin   = nowMins();
  const schedMin = hm2min(dep.departs);
  const delay    = rtDelay(dep.trip_id);
  const delaySec = delay ?? 0;
  const actualMin = schedMin + Math.round(delaySec / 60);
  const minsAway  = actualMin - nowMin;

  // Time cell — only show strikethrough if displayed minute actually changes
  const timeEl = el('span', 'dep-time');
  const schedDisplay = dep.departs;
  const actualDisplay = toHHMM(actualMin);
  const minuteChanged = schedDisplay !== actualDisplay;

  if (delay !== null && delaySec !== 0 && minuteChanged) {
    timeEl.classList.add('delayed');
    const sched = el('span', 'sched');
    sched.textContent = schedDisplay;
    const actual = el('span', 'actual');
    actual.textContent = actualDisplay;
    timeEl.append(sched, actual);
  } else {
    const actual = el('span', 'actual');
    actual.textContent = schedDisplay;
    timeEl.appendChild(actual);
  }

  // Countdown
  const minsEl = el('span', 'dep-mins' + (minsAway <= 2 ? ' soon' : ''));
  minsEl.textContent = minsAway <= 0 ? 'Now'
                     : minsAway === 1 ? '1 min'
                     : minsAway >= 60 ? '1 hr +'
                     : `${minsAway} min`;

  // Destination + route
  const info = el('div', 'dep-info');
  const dest = el('div', 'dep-dest');

  let badge = '';
  if (delay !== null) {
    if (!minuteChanged)
      badge = '<span class="rt-ontime">on time</span>';
    else if (delaySec >= 0)
      badge = `<span class="rt-late">${Math.max(1, Math.round(delaySec/60))} min late</span>`;
    else
      badge = '<span class="rt-early">Early</span>';
  }
  dest.innerHTML = escHtml(dep.dest) + badge;

  const route = el('div', 'dep-route');
  const routeBadge = el('span', 'route-badge');
  routeBadge.style.backgroundColor = dep.colour || '#ccc';
  routeBadge.textContent = dep.route;

  if (dep.stype) {
    route.append(routeBadge, document.createTextNode(` · ${dep.stype}`));
  } else {
    route.appendChild(routeBadge);
  }
  info.append(dest, route);

  // Caret
  const caret = el('span', 'dep-caret');
  caret.textContent = openTrip === dep.trip_id ? '▲' : '▼';

  row.append(timeEl, minsEl, info, caret);

  const toggle = async () => {
    if (openTrip === dep.trip_id) { openTrip = null; render(); return; }
    openTrip = dep.trip_id;
    render();
    await ensurePattern(dep.route);
    render();
  };
  row.addEventListener('click', toggle);
  row.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
  });

  return row;
}

// ── Stopping pattern ──────────────────────────────────────────────────────────
async function ensurePattern(route) {
  if (patCache[route]) return;
  try {
    const r = await fetch(`${DATA}/patterns_${safeFn(route)}.json`);
    patCache[route] = await r.json();
  } catch {
    patCache[route] = {};
  }
}

function buildPattern(dep) {
  const wrap = el('div', 'pattern');
  wrap.style.setProperty('--lc', dep.colour);

  const trips = patCache[dep.route];
  const full  = trips && trips[dep.trip_id];

  if (!full) {
    const loading = el('div', 'pat-loading');
    loading.textContent = 'Loading stops…';
    wrap.appendChild(loading);
    return wrap;
  }

  // dep.pat_idx counts only real stops (not __EXP__ entries).
  // Find that stop's position in the annotated pattern.
  let realIdx = 0, stopCount = 0;
  for (let i = 0; i < full.length; i++) {
    if (full[i][0] === '__EXP__') continue;
    if (stopCount === dep.pat_idx) { realIdx = i; break; }
    stopCount++;
  }

  const stops = full.slice(realIdx);
  const last  = stops.reduce((acc, [n], i) => n !== '__EXP__' ? i : acc, 0);

  stops.forEach(([name, time], i) => {
    if (name === '__EXP__') {
      const row = el('div', 'pat-express');
      row.textContent = `Express: ${time}`;
      wrap.appendChild(row);
      return;
    }
    const row = el('div', 'pat-stop' +
      (i === 0    ? ' is-here' : '') +
      (i === last ? ' is-end'  : ''));
    const t = el('span', 'pat-time');
    t.textContent = time;
    const n = el('span', 'pat-name');
    n.textContent = name;
    row.append(t, n);
    wrap.appendChild(row);
  });

  return wrap;
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes());
  if (stationData) render();
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function nowMins()  { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function dayType()  { const d = new Date().getDay(); return d===0?'sunday':d===6?'saturday':'weekday'; }
function todayDate(){ const n = new Date(); return n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate(); }
function hm2min(hhmm) { const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
function toHHMM(mins) { return `${pad(Math.floor(mins/60))}:${pad(mins%60)}`; }

function platSort(a, b) {
  if (a === '—') return 1;
  if (b === '—') return -1;
  const na = parseInt(a), nb = parseInt(b);
  if (!isNaN(na) && !isNaN(nb)) return na - nb;
  return a.localeCompare(b, undefined, { numeric: true });
}

function safeFn(s)   { return s.replace(/[^A-Za-z0-9_\-]/g, '_'); }
function pad(n)      { return String(n).padStart(2, '0'); }
function el(t, c)    { const e = document.createElement(t); if (c) e.className = c; return e; }
function setBoard(h) { document.getElementById('board').innerHTML = h; }
function escHtml(s)  { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
